[project]
name = "image3d-scenegraph"
version = "0.1.0"
description = "Calibration-free image/video to semantic 3D scene reconstruction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.139.0",
    "numpy>=1.26",
    "python-multipart>=0.0.32",
    "uvicorn>=0.50.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image3d_scenegraph", "backend"]
