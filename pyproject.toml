[project]
name = "image3d-scenegraph"
version = "0.1.0"
description = "Calibration-free image/video to semantic 3D scene reconstruction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.139.0",
    "numpy>=1.26",
    "open3d>=0.19.0",
    "opencv-python-headless>=4.10,<4.12",
    "pillow>=10",
    "python-multipart>=0.0.32",
    "scipy>=1.11",
    "uvicorn>=0.50.1",
]

[project.optional-dependencies]
gpu = [
    "gsplat @ https://github.com/nerfstudio-project/gsplat/releases/download/v1.5.3/gsplat-1.5.3%2Bpt23cu121-cp310-cp310-linux_x86_64.whl ; python_version == '3.10' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch==2.3.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15.15,<0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/image3d_scenegraph", "backend"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"tests/test_gaussian_evaluation.py" = ["E402"]
"tests/test_gaussian_export.py" = ["E402"]
"tests/test_gaussian_model.py" = ["E402"]
"tests/test_gaussian_render.py" = ["E402"]
"tests/test_gaussian_trainer.py" = ["E402"]
"tests/test_vggt_ba.py" = ["E402"]
